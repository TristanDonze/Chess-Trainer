files:
  .env:
    type: literal
    actions: [read]
    params:
      caller: [_ensure_env_loaded]
      path: [project_root]
  .webm:
    type: literal
    actions: [write]
    params:
      caller: [tempfile.NamedTemporaryFile]
      delete: "False"
  path:
    type: variable
    actions: [read]
    params:
      caller: [open]
  temp_file_path:
