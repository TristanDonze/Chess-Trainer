manifest:
  version: "0.1.2"
  schema: https://a2as.org/cert/schema
  subject:
    name: tristandonze/chess-trainer
    source: https://github.com/tristandonze/chess-trainer
    branch: main
    commit: "a377aa3f"
    scope: [backend/src/rag/service.py, misc/rag/src/chess_agent.py, misc/rag/src/chess_rag.py, misc/rag/src/config.py, misc/rag/src/openai_client.py]
  issued:
    by: A2AS.org
    at: '2026-01-26T16:15:02Z'
  signatures:
    digest: sha256:L-NyqznzkHEq9bAGelsAVl0wOdN4szEMxYdEIOlp_Jk
    key: ed25519:RDQFgDp9S5ayjq4PfA7LXcCBrVPq4OaMr01_00i_e7I
    sig: ed25519:igBvNW4mDD2o6V3z8KSQ6lPusQOlJHtZlcvrnh21hvwdTprg-T1hDQZ595-CZ60tUJmPDwYX9BCo1FMGxauxDw

agents:
  _chess_agent_instance:
    type: instance
    models: [gpt-4o]
    tools: [retrieve_chess_knowledge_tool, update_game_state_tool, get_stockfish_analysis_tool]
    params:
      class: ChessTrainerAgent
      name: Chess Trainer
      model_settings: ModelSettings(verbosity=medium, reasoning=Reasoning(effort=high))
      instructions: ['You are an expert chess trainer and coach. You help players improve their chess skills by:', 1. Analyzing
          chess positions and suggesting the best moves, '2. Explaining chess strategies, tactics, and principles', '3. Teaching
          chess openings, middlegame plans, and endgame techniques', 4. Providing feedback on chess positions and games, 'Current
          Position: {self.current_fen}', 'Stockfish Analysis: {self.stockfish_input}', Speak naturally and conversationally.
          Keep responses concise but informative for voice interaction., Always consider the current board position when giving
          advice.]

models:
  gpt-4o:
    type: literal
    agents: [_chess_agent_instance]

tools:
  get_stockfish_analysis_tool:
    type: decorator
    agents: [_chess_agent_instance]
    params:
      description: Get Stockfish analysis of current position
  retrieve_chess_knowledge_tool:
    type: decorator
    agents: [_chess_agent_instance]
    params:
      description: Retrieve relevant chess knowledge from the knowledge base.
  update_game_state_tool:
    type: decorator
    agents: [_chess_agent_instance]
    params:
      description: Update the current game state

imports:
  Agent: agents.Agent
  analyze_recent_games: src.analysis.analyze_recent_games
  annotations: __future__.annotations
  Any: typing.Any
  asyncio: asyncio
  AsyncIterator: typing.AsyncIterator
  AudioInput: agents.voice.AudioInput
  Auth: weaviate.classes.init.Auth
  AVAILABLE_MODELS: meta.AVAILABLE_MODELS
  base64: base64
